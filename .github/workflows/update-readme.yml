name: Update README

# Rebuilds README.md from the templates (*.xml) whenever one is added or changed, so a new app
# shows up in the list without editing the README by hand.

on:
  push:
    branches: [main]
    paths: ["*.xml", ".github/scripts/update_readme.py", ".github/workflows/update-readme.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Two apps pushing their templates at once: one run at a time, the later one sees both
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python .github/scripts/update_readme.py
      - name: Commit README
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update README from templates"
          git pull --rebase origin main
          git push origin HEAD:main
